<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
    <button id="a">Btn1</button>
     <button id="b">Btn2</button>
      <button id="c">Btn3</button>
       <button id="d">Btn4</button>
        <button id="e">Btn5</button>
         <button id="f">Btn6</button>
      </div>
       <p>0</p>
          
         <script>
            let btns=document.querySelectorAll('button')
          let para = document.querySelector('p')

          for(let t of btns){
            t.addEventListener('click',update)
          }
         // let set = new Set()
           let arr=[]
          function update(e){
            console.log('button arr', arr)
            let clickbtn=e.target
         if(arr.includes(clickbtn)){    //if(set.has(clickbtn))
                return 
            }
            // set.add(clickbtn)
            arr.push(clickbtn)
            para.innerText=+para.innerText + 1
          }
         </script>
</body>
</html>

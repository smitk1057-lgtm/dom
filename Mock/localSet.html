<body>

    <button>Click</button>
    <script>

        }
    btn.addEventListener('click',(e)=>{

          const jsonData = JSON.stringify(obj) // converting into json format 
          console.log(jsonData)
          localStorage.setItem("value",jsonData)
    })
    </script>

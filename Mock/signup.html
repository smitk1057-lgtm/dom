<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px 15px;
    }

    form {
      max-width: 400px;
      margin: 0 auto 30px;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000015;
    }

    h2 {
      text-align: center;
      color: #312e81;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 4px #6366f155;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 7px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #3730a3;
    }

    table {
      width: 100%;
      max-width: 600px;
      margin: auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 15px #00000010;
    }

    th, td {
      border: 1px solid #d1d5db;
      padding: 12px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    th {
      background: #4f46e5;
      color: white;
    }

    tr:nth-child(even) {
      background: #eef2ff;
    }

    @media (max-width: 480px) {
      body {
        padding: 25px 12px;
      }

      th, td {
        padding: 9px;
      }
    }
  </style>
</head>
<body>
    <form action="">

  <input type="text" id="text" placeholder="name"/ >
  <br>
  <input type="password" id="password" placeholder="password" />
   <button>Click</button>
    </form>
    <table >
        <tr>
            <th>Name</th>
            <th>Password</th>
        </tr>  
    </table>
    <script>
        let text = document.querySelector("#text")
        let  pass = document.querySelector("#password")
        let btn = document.querySelector("button")
       let table = document.querySelector("table")
        btn.addEventListener('click',(e)=>{
            e.preventDefault()
            let tr=document.createElement("tr")
            let td1 = document.createElement("td")
            let td2 =  document.createElement("td")
            if(text.value=='' || pass.value==''){
                return 
            }
            td1.innerText=text.value
            td2.innerText=pass.value
            console.log(td1,td2)
            tr.append(td1,td2)
            table.append(tr)
            text.value=''
            pass.value=''
        })
    </script>
</body>
</html>

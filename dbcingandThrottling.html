<body>
    
        <form action="">
            <input type="text"  name ='email' placeholder=" Enter Your Email" id="email">
            <button>Submit</button>
            
        </form>
    <div></div>
    <script>
        let form=document.querySelector("form")
        let email_box= document.querySelector("#email")
    let div = document.querySelector('div')

    form.addEventListener('submit',throt())

     function display(){
       // e.preventDefault()
        let para=document.createElement('p')
        para.innerText=email_box.value
        div.append(para)
       // email_box=''
     }

     function throt(){
      
        let flag=true
        console.log("AA")
        return (
             (e)=>{
                e.preventDefault()
                console.log("BB")
                if(flag==true){
                    display()
                    flag=false
                    setTimeout(()=>{
                        flag=true
                    },5000)
                }
                else{
                    console.log('false Click')
                }
            }     
    )
        }

    
    </script>
</body>
